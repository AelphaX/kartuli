<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartuli - Georgisch Lernen</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --primary: #4a90e2;
            --btn-hover: #e0e0e0;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --card-bg: #16213e;
            --primary: #0f3460;
            --btn-hover: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            align-items: center;
        }

        .stats {
            font-weight: bold;
            font-size: 1.2rem;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 1rem;
            background-color: var(--card-bg);
            color: var(--text-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        /* Flashcard Styles */
        .card-container {
            width: 100%;
            max-width: 400px;
            height: 250px;
            perspective: 1000px;
            margin-bottom: 30px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .georgian-text {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .pronunciation {
            color: #888;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .translation {
            font-size: 2rem;
            font-weight: bold;
        }

        /* Buttons under card */
        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .controls.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .controls button {
            flex: 1;
            padding: 15px 0;
            font-weight: bold;
        }

        .btn-again { border-bottom: 4px solid #ff4757; }
        .btn-hard { border-bottom: 4px solid #ffa502; }
        .btn-good { border-bottom: 4px solid #2ed573; }
        .btn-easy { border-bottom: 4px solid #1e90ff; }

        footer {
            margin-top: auto;
            padding-top: 40px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <div class="stats">Karten: <span id="counter">1/5</span></div>
        <button id="theme-toggle">🌙 Dark Mode</button>
    </header>

    <div class="card-container">
        <div class="card" id="flashcard">
            <div class="card-face card-front">
                <div class="georgian-text" id="word-geo">გამარჯობა</div>
            </div>
            <div class="card-face card-back">
                <div class="georgian-text" id="word-geo-back">გამარჯობა</div>
                <div class="pronunciation" id="word-pron">[gamarjoba]</div>
                <div class="translation" id="word-de">Hallo</div>
            </div>
        </div>
    </div>

    <div class="controls" id="controls">
        <button class="btn-again" onclick="nextCard()">Nochmal</button>
        <button class="btn-hard" onclick="nextCard()">Schwer</button>
        <button class="btn-good" onclick="nextCard()">Gut</button>
        <button class="btn-easy" onclick="nextCard()">Einfach</button>
    </div>

    <footer>done with love in Weingarten (nicht Heidelberg)</footer>

    <script>
        // Vokabel-Datenbank
        const vocabDB = [
            { geo: "გამარჯობა", pron: "gamarjoba", de: "Hallo / Guten Tag" },
            { geo: "მადლობა", pron: "madloba", de: "Danke" },
            { geo: "კი", pron: "ki", de: "Ja" },
            { geo: "არა", pron: "ara", de: "Nein" },
            { geo: "ნახვამდის", pron: "nakhvamdis", de: "Auf Wiedersehen" }
        ];

        let currentIndex = 0;
        const card = document.getElementById('flashcard');
        const controls = document.getElementById('controls');
        const counter = document.getElementById('counter');
        const themeToggle = document.getElementById('theme-toggle');

        // Karte umdrehen
        card.addEventListener('click', () => {
            card.classList.add('is-flipped');
            controls.classList.add('visible');
        });

        // Nächste Karte laden
        function nextCard() {
            // Karte zurückdrehen
            card.classList.remove('is-flipped');
            controls.classList.remove('visible');

            // Kurze Verzögerung für die Drehanimation
            setTimeout(() => {
                currentIndex++;
                if (currentIndex >= vocabDB.length) {
                    alert("Du hast alle Karten für heute geschafft! Starte von vorn.");
                    currentIndex = 0;
                }
                updateCardContent();
            }, 300);
        }

        // Inhalte aktualisieren
        function updateCardContent() {
            const currentVocab = vocabDB[currentIndex];
            document.getElementById('word-geo').innerText = currentVocab.geo;
            document.getElementById('word-geo-back').innerText = currentVocab.geo;
            document.getElementById('word-pron').innerText = `[${currentVocab.pron}]`;
            document.getElementById('word-de').innerText = currentVocab.de;
            counter.innerText = `${currentIndex + 1}/${vocabDB.length}`;
        }

        // Dark Mode Logic
        themeToggle.addEventListener('click', () => {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                themeToggle.innerText = '🌙 Dark Mode';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeToggle.innerText = '☀️ Light Mode';
            }
        });

        // App initialisieren
        updateCardContent();
    </script>
</body>
</html>
